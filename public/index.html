<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa parcel Jičín</title>
</head>
<body>
    <h1>Mapa parcel Jičín</h1>
    <pre id="status">Kontroluji API…</pre>

    <script>
        fetch('/api/health')
            .then((response) => response.json())
            .then((health) => {
                document.getElementById('status').textContent = JSON.stringify(health, null, 2);
            })
            .catch((error) => {
                document.getElementById('status').textContent = `Chyba API: ${error.message}`;
            });
    </script>
</body>
</html>
